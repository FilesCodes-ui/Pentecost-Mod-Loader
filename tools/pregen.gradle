tasks.register('pregenSeed', JavaExec) {
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'khi.pentecost.menuworld.SeedPregen'
    workingDir = file('run')
    systemProperty 'pentecost.home', rootDir.path
    def seedArg = (findProperty('seed') ?: '4556775').toString()
    def radiusArg = (findProperty('radius') ?: '4').toString()
    if (findProperty('cx') == null) {
        args seedArg, 'spawn', radiusArg
    } else {
        args seedArg, findProperty('cx').toString(), (findProperty('cz') ?: '0').toString(), radiusArg
    }
    doFirst { file('run').mkdirs() }
}
