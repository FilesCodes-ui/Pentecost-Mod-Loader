// Generates a menu-world seed with a vanilla server in its own JVM. Applied from build.gradle.
// Centred on the world spawn by default:   gradle pregenSeed -Pseed=4556775 -Pradius=32
// Or on a chosen block:                    gradle pregenSeed -Pseed=4556775 -Pcx=-1792 -Pcz=544 -Pradius=32
// The Mojang EULA must be accepted first: this task writes eula=true for its own temporary server folder.
tasks.register('pregenSeed', JavaExec) {
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'khi.pentecost.menuworld.SeedPregen'
    workingDir = file('run')
    systemProperty 'pentecost.home', rootDir.path
    def seedArg = (findProperty('seed') ?: '4556775').toString()
    def radiusArg = (findProperty('radius') ?: '4').toString()
    if (findProperty('cx') == null) {
        args seedArg, 'spawn', radiusArg
    } else {
        args seedArg, findProperty('cx').toString(), (findProperty('cz') ?: '0').toString(), radiusArg
    }
    doFirst { file('run').mkdirs() }
}
