plugins {
    id 'java'
    id 'application'
}

group = 'khi.pentecost'
version = '0.6.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

sourceSets {
    testmodFabric { compileClasspath += sourceSets.main.output }
    testmodForge { compileClasspath += sourceSets.main.output }
    testmodQuilt { }
}

dependencies {
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.ow2.asm:asm-commons:9.7.1'
    implementation 'org.ow2.asm:asm-tree:9.7.1'
    implementation 'org.ow2.asm:asm-analysis:9.7.1'
    implementation 'org.ow2.asm:asm-util:9.7.1'
    // The Mixin library (MIT). Pentecost hosts it. Forge and Fabric both ship a copy of it.
    implementation 'net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7'
    implementation 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.electronwill.night-config:toml:3.6.7'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'khi.pentecost.boot.PentecostMain'
    applicationDefaultJvmArgs = ['-Xms6G', '-Xmx6G', '-Xmn3G', '-XX:-DontCompileHugeMethods']
}

tasks.named('run') {
    workingDir = file('run')
    systemProperty 'pentecost.home', rootDir.path
    doFirst { file('run').mkdirs() }
}

test {
    useJUnitPlatform()
    systemProperty 'pentecost.expectedVersion', project.version.toString()
}

['Fabric', 'Forge', 'Quilt'].each { n ->
    tasks.register("testmod${n}Jar", Jar) {
        archiveFileName = "pentecost-test-${n.toLowerCase()}.jar"
        destinationDirectory = layout.buildDirectory.dir('testmods')
        from sourceSets["testmod${n}"].output
    }
}

tasks.register('testmods') {
    dependsOn 'testmodFabricJar', 'testmodForgeJar', 'testmodQuiltJar'
}

// The Forge glue compiles against Forge's own jars, so it exists only after the setup command ran.
def forgeLibs = file('cache/forge-install/libraries')
def forgeNamed = fileTree('cache/remapped') { include 'forge-*-universal-named.jar', 'client-*-forge-named.jar' }
def forgeReady = forgeLibs.isDirectory() && !forgeNamed.isEmpty()
if (forgeReady) {
    sourceSets {
        forgeglue {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + forgeNamed +
                    fileTree(forgeLibs) {
                        include '**/*.jar'
                        exclude 'net/minecraft/**', 'de/oceanlabs/**', 'org/spongepowered/**', 'org/ow2/**'
                        exclude '**/*-client.jar', '**/*-universal.jar'
                    } + fileTree('cache/libraries') { include '**/*.jar' }
        }
    }
}

// The game glue is Pentecost's own in-game code (screens). It compiles against the converted game jar.
def gameNamed = fileTree('cache/remapped') { include 'client-*-named.jar'; exclude '*-forge-named.jar' }
def gameReady = !gameNamed.isEmpty()
if (gameReady) {
    sourceSets {
        gameglue {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + gameNamed +
                    fileTree('cache/libraries') { include '**/*.jar' }
        }
    }
}

def pentecostExec = { String taskName, List<String> taskArgs ->
    tasks.register(taskName, JavaExec) {
        javaLauncher = javaToolchains.launcherFor(java.toolchain)
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'khi.pentecost.boot.PentecostMain'
        args taskArgs
        workingDir = file('run')
        systemProperty 'pentecost.home', rootDir.path
        // A large young area makes memory cleanups rarer. At 4 GB the game stuttered about every 4 s; at 6 GB with
        // a 3 GB young area, shaders on, it went from about 40 to about 60 fps.
        def pentecostSettings = file('run/config/pentecost/settings.json')
        def saved = pentecostSettings.isFile() ? new groovy.json.JsonSlurper().parseText(pentecostSettings.text) : [:]
        int heapGb = Math.max(2, (saved['java.memory'] ?: '6') as int)
        // Backup memory: room above the working size for spikes. The game never goes past the two added together.
        int reserveGb = Math.max(0, (saved['java.reserve'] ?: '2') as int)
        int youngSaved = (saved['java.young'] ?: '0') as int
        int youngGb = youngSaved > 0 ? Math.max(1, Math.min(youngSaved, heapGb - 1)) : Math.max(1, heapGb.intdiv(2))
        jvmArgs "-Xms${heapGb}G", "-Xmx${heapGb + reserveGb}G"
        if ((saved['java.gc'] ?: 'g1') == 'zgc') {
            jvmArgs '-XX:+UseZGC', '-XX:+ZGenerational'
            if (reserveGb > 0) {
                jvmArgs "-XX:SoftMaxHeapSize=${heapGb}G"
            }
        } else {
            jvmArgs "-Xmn${youngGb}G"
            if ((saved['java.gc'] ?: 'g1') == 'parallel') {
                jvmArgs '-XX:+UseParallelGC'
            }
        }
        def flagFile = file('run/config/pentecost/jvm-flags.txt')
        if (flagFile.isFile()) {
            flagFile.readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }.each { jvmArgs it }
        }
        // The JVM never compiles a method over 8000 bytes of bytecode, so it runs in the slow interpreter.
        // Some mods ship such methods (Management Wanted has a 25000 byte one that runs for every living entity every tick).
        jvmArgs '-XX:-DontCompileHugeMethods'
        // Extra flags for tests, for example PENTECOST_JVM=-Xmx8G -Xmn4G. They come after the defaults, so they win.
        if (System.getenv('PENTECOST_JVM')) {
            jvmArgs System.getenv('PENTECOST_JVM').trim().split(/\s+/).toList()
        }
        if ((System.getenv('PENTECOST_GC') ?: '').equalsIgnoreCase('zgc')) {
            jvmArgs '-XX:+UseZGC', '-XX:+ZGenerational'
        }
        if (System.getenv('PENTECOST_JFR')) {
            jvmArgs "-XX:StartFlightRecording=filename=${file('run/startup.jfr').path},settings=profile,dumponexit=true",
                    '-XX:FlightRecorderOptions=stackdepth=128'
        }
        jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED',
                '--add-opens', 'java.base/java.util.jar=ALL-UNNAMED',
                '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
                '--add-opens', 'java.base/java.util=ALL-UNNAMED',
                '--add-exports', 'java.base/sun.security.util=ALL-UNNAMED'
        if (gameReady) {
            dependsOn 'gameglueClasses'
            systemProperty 'pentecost.gameglue', sourceSets.gameglue.output.classesDirs.asPath
        }
        if (forgeReady) {
            classpath += fileTree(forgeLibs) { include 'cpw/mods/securejarhandler/**/*.jar' }
            dependsOn 'forgeglueClasses'
            systemProperty 'pentecost.forgeglue', sourceSets.forgeglue.output.classesDirs.asPath
        }
        doFirst { file('run').mkdirs() }
    }
}

// Loads the converted game through the Pentecost class loader and starts the three test mods. No game window.
pentecostExec('selftest', ['check', '--mods', layout.buildDirectory.dir('testmods').get().asFile.path, '--selftest'])
tasks.named('selftest') { dependsOn 'testmods' }

// Starts the game with the mods in cache/try. Put jars there to test them.
pentecostExec('runTry', ['launch', '--mods', file('cache/try').path])
// The same, with Forge's real code loaded so Forge mods run.
pentecostExec('runForge', ['launch', '--forge', '--mods', file('cache/try').path])
// Headless check of the mods in cache/try with the Forge layer: no window.
pentecostExec('verifyTry', ['verify', '--forge', '--mods', file('cache/try').path])
pentecostExec('runPlay', ['launch', '--forge', '--mods', file('mods').path])

// Test suite. Example: gradle fetchMods -Pcount=25, then gradle verifyMods
def modCount = (findProperty('count') ?: '25').toString()
pentecostExec('fetchFabric', ['fetch', '--loader', 'fabric', '--count', modCount])
pentecostExec('fetchForge', ['fetch', '--loader', 'forge', '--count', modCount])
tasks.register('fetchMods') { dependsOn 'fetchFabric', 'fetchForge' }
// Checks the mods in cache/testmods/target, the pack Gabriel wants to run.
pentecostExec('verifyTarget', ['verify', '--mods', file('cache/testmods/target').path])
pentecostExec('verifyTargetForge', ['verify', '--forge', '--mods', file('cache/testmods/target').path])
pentecostExec('verifyMods', ['verify', '--mods', file('cache/testmods/fabric').path, '--mods', file('cache/testmods/forge').path])
 
// The version the game reports comes from here (build.gradle's version), written into the main jar as boot/version.txt.
def versionDir = layout.buildDirectory.dir('generated/version')
def writeVersion = tasks.register('writeVersion') {
    def out = versionDir.map { it.file('khi/pentecost/boot/version.txt') }
    inputs.property('version', project.version.toString())
    outputs.file(out)
    doLast {
        out.get().asFile.parentFile.mkdirs()
        out.get().asFile.text = project.version.toString()
    }
}
sourceSets.main.output.dir(versionDir, builtBy: writeVersion)

apply from: 'tools/pregen.gradle'
apply from: 'packaging/dist.gradle'
